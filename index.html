<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Map of the Copenhagen bars pouring free Tuborg Julebryg on J-dag, 6 November 2026. Beer drops at 20:59.">
  <title>J-dag i København</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./vendor/MarkerCluster.css">
  <link rel="stylesheet" href="./vendor/MarkerCluster.Default.css">
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="hat" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M7 22.5 18 7l11 15.5z" fill="#d94a3a"/>
          <rect x="5" y="22.5" width="26" height="6" rx="1.2" fill="#f4efe4"/>
          <circle cx="18" cy="16.5" r="2.1" fill="#f4efe4"/>
        </svg>
        <div>
          <h1>J-dag</h1>
          <p class="lede">Copenhagen · free Tuborg from 20:59</p>
        </div>
      </div>
      <div class="clock" aria-live="polite">
        <strong id="clock-value">–</strong>
        <span id="clock-label">until julebryg</span>
      </div>
    </header>

    <div class="tools">
      <label class="search">
        <span class="sr">Search bars</span>
        <input id="q" type="search" placeholder="Search bars" autocomplete="off" enterkeyhint="search">
      </label>
      <button id="locate" type="button">Near me</button>
      <button id="metro" type="button" aria-pressed="true">Metro</button>
      <button id="share" type="button">Share</button>
    </div>

    <div class="chips" id="chips" role="tablist" aria-label="Districts"></div>

    <div class="stage">
      <aside id="panel">
        <div id="card" hidden></div>
        <p id="summary"></p>
        <ul id="list"></ul>
        <p class="fine">List from <a href="https://migogkbh.dk/oel-og-nisser-paa-j-dag-i-koebenhavn/">migogkbh.dk</a>, plus verified adds from Tuborg and venue pages. Special = free beer / deals / live music with a cited 2026 promo. Metro stops from OpenStreetMap. Pub pins can sit a door off — check Rating before you commit.</p>
      </aside>
      <div id="map" role="application" aria-label="Map of J-dag bars in Copenhagen"></div>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="./vendor/leaflet.markercluster.js"></script>
  <script src="./app.js?v=6"></script>
</body>
</html>
